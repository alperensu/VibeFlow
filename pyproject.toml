[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeflow-core"
version = "0.2.0"
description = "Local, editor-agnostic context optimization sidecar for AI coding workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "alperensu" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "watchdog>=4.0.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vibeflow = "vibeflow_cli:main"

[tool.setuptools]
py-modules = ["config", "run", "vibeflow_cli"]
packages = ["api", "core", "storage"]
